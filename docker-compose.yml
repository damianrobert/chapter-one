# Local runtime for Chapter One. `docker compose up --build` starts the whole system.
# Values like ${CATALOG_PORT} come from .env (copy .env.example); the part after ":-"
# is the default used when the variable isn't set, so it also works without a .env.

name: chapter-one

services:
  # The front door: the frontend (and you, with curl) talk to this one.
  gateway:
    build: ./services/gateway
    image: chapter-one/gateway
    environment:
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Where to forward /api/books and /api/carts. Docker's DNS resolves these names.
      CATALOG_URL: http://catalog:8001
      CART_URL: http://cart:8002
      # Signs login tokens. The default is only for local use; set a real one in .env.
      # Only the gateway gets this (hard rule 8).
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-do-not-use-elsewhere}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    # Only "start after they have started", NOT "wait until healthy": the gateway
    # must cope with a service being down anyway (it answers 503 for that service's
    # requests).
    depends_on:
      - catalog
      - cart
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  catalog:
    build: ./services/catalog
    image: chapter-one/catalog
    environment:
      PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # "catalog-db" is the Compose service name below; Docker's DNS resolves it.
      DATABASE_URL: postgresql+asyncpg://${CATALOG_DB_USER:-catalog}:${CATALOG_DB_PASSWORD:-catalog}@catalog-db:5432/${CATALOG_DB_NAME:-catalog_db}
    ports:
      # host:container — the container always listens on 8001; the host port is configurable.
      - "${CATALOG_PORT:-8001}:8001"
    depends_on:
      # Start catalog only once Postgres answers. Convenient locally, but Kubernetes has
      # no equivalent — the service itself must cope with the DB being down (it does:
      # it starts anyway and /health/ready reports 503 until the DB is reachable).
      catalog-db:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl, so use Python's stdlib for the probe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Catalog's own database. Only the catalog service gets these credentials
  # (hard rule: no shared databases). No host port is published; to inspect it use
  #   docker compose exec catalog-db psql -U catalog -d catalog_db
  catalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog_db}
    volumes:
      # Postgres 18+ images expect the volume at /var/lib/postgresql (not .../data).
      - catalog-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cart:
    build: ./services/cart
    image: chapter-one/cart
    environment:
      PORT: 8002
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # "cart-redis" is the Compose service below; "/0" is Redis database number 0.
      REDIS_URL: redis://cart-redis:6379/0
      # The cart asks catalog whether a book exists and what it costs.
      CATALOG_URL: http://catalog:8001
    ports:
      - "${CART_PORT:-8002}:8002"
    # Like catalog: start once Redis answers. The cart copes with Redis being down
    # anyway (/health/ready reports 503 until it's back).
    # Catalog: only "started", not "healthy" — the cart must cope with catalog being
    # down anyway (adding books answers 503; reading/removing still works).
    depends_on:
      cart-redis:
        condition: service_healthy
      catalog:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Cart's own Redis. Only the cart service gets its address (hard rule: no shared
  # databases). No host port is published; to inspect it use
  #   docker compose exec cart-redis redis-cli
  cart-redis:
    image: redis:8-alpine
    volumes:
      # Redis saves a snapshot to /data now and then, so carts survive a restart.
      - cart-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # Named volumes: data survives `docker compose down`; `down -v` deletes it.
  catalog-db-data:
  cart-redis-data:
