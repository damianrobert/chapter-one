# Tool configuration only. Dependencies live in requirements*.txt.

[tool.pytest.ini_options]
# Lets tests do `from app.main import app` without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a real Postgres (started in Docker via testcontainers); skip with -m 'not db'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics, I: import sorting, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
