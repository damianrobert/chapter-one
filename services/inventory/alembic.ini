# Alembic config for inventory_db.
# The database URL is NOT here: migrations/env.py reads DATABASE_URL from the
# environment (via app.config), same as the app, so there's one source of truth.

[alembic]
script_location = migrations
# Put the service root on sys.path so env.py can `import app.config`.
prepend_sys_path = .
# How to split multiple paths above: use the OS's separator (":" on Linux).
path_separator = os

# Logging is NOT configured here: migrations/env.py uses the app's JSON logging
# (app/logging_config.py), so migration logs look like every other log line.
