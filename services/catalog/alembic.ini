# Alembic config for catalog_db.
# The database URL is NOT here: migrations/env.py reads DATABASE_URL from the
# environment (via app.config), same as the app, so there's one source of truth.

[alembic]
script_location = migrations
# Put the service root on sys.path so env.py can `import app.config`.
prepend_sys_path = .

# --- Logging (so `alembic upgrade` prints which migrations ran) ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
