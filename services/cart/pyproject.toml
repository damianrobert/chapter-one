# Tool configuration only. Dependencies live in requirements*.txt.

[tool.pytest.ini_options]
# Lets tests do `from app.main import app` without installing the package.
# "." lets tests do `from app.main import app`; "../.." (the repo root) lets the code
# do `from shared.events import ...`, like it can inside the Docker image.
pythonpath = [".", "../.."]
testpaths = ["tests"]
markers = [
    "redis: needs a real Redis (started in Docker via testcontainers); skip with -m 'not redis'",
    "rabbitmq: needs a real RabbitMQ (started in Docker via testcontainers); skip with -m 'not rabbitmq'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics, I: import sorting, B: common bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "shared"]
